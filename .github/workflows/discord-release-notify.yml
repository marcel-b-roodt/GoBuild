name: Discord Release Notification

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  notify-discord:
    name: Post release to Discord (optional)
    runs-on: ubuntu-latest

    steps:
      - name: Build Discord payload
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_RELEASE }}
          RELEASE_NAME: ${{ github.event.release.name }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          if [ -z "${WEBHOOK_URL:-}" ]; then
            echo "::notice::DISCORD_WEBHOOK_RELEASE not set; skipping Discord post."
            exit 0
          fi

          SUMMARY=$(printf "%s" "$RELEASE_BODY" | sed 's/\r//g' | sed '/^\s*$/d' | head -n 8)
          if [ -z "$SUMMARY" ]; then
            SUMMARY="(No highlights were included in the release body.)"
          fi

          CONTENT=$(cat <<EOF
@here

GoBuild ${TAG_NAME} is live.

${RELEASE_NAME}
${RELEASE_URL}

Highlights:
${SUMMARY}

Try the new version from GitHub and share feedback.
EOF
)

          jq -n --arg content "$CONTENT" '{content:$content}' > payload.json

          curl -sS \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$WEBHOOK_URL" || echo "::warning::Discord reminder webhook returned a non-2xx response; continuing."
